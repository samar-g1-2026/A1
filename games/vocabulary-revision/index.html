<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Revision | Grammar Adventure</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:system-ui;background:linear-gradient(135deg,#efe3ff,#b9a0ff)}.card{width:min(700px,100%);background:#fff;border-radius:28px;padding:clamp(20px,5vw,42px);text-align:center;box-shadow:0 20px 50px #37205d30;color:#2f2350}a{color:#6742b2;font-weight:800}.tag{font-weight:900;letter-spacing:2px;color:#7650bc;font-size:12px}h1{font-size:clamp(28px,6vw,45px);margin:8px}.icon{font-size:60px}.clue{font-size:clamp(20px,4vw,28px);font-weight:800;margin:22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:2px solid #ded2ff;background:#f8f4ff;border-radius:14px;padding:14px;font-weight:900;font-size:16px;cursor:pointer;color:#493274}button:hover{background:#e9dcff}.feedback{min-height:32px;font-weight:800}#next{background:#6844b0;color:white;border:0;margin-top:12px}@media(max-width:480px){.answers{grid-template-columns:1fr}}</style></head><body><main class="card"><p><a href="../../">← Back to Games</a></p><div class="tag">VOCABULARY • GRADE 1</div><div class="icon">⚡</div><h1>Vocabulary Revision</h1><p>Read the clue and choose the matching word.</p><div id="clue" class="clue"></div><div id="answers" class="answers"></div><p id="feedback" class="feedback"></p><p>⭐ Score: <b id="score">0</b></p><button id="next">Next Word →</button></main><script>const qs=[['A person who leads a group','leader',['leader','goalie','space','fancy']],['A bright flash in a storm','lightning',['thunder','hail','lightning','tornado']],['A target in a game','goal',['goal','conductor','aboard','fluffy']],['The loud sound during a storm','thunder',['hail','thunder','space','goalie']],['Decorative or special','fancy',['fancy','leader','tornado','aboard']],['On or inside a train, ship, or plane','aboard',['aboard','space','goal','lightning']],['Small balls of ice from clouds','hail',['hail','thunder','fancy','conductor']],['The area beyond Earth','space',['space','goalie','leader','fluffy']],['A player who guards the goal','goalie',['goalie','goal','fancy','tornado']],['A spinning column of air','tornado',['tornado','lightning','aboard','space']]];let i=0,score=0,done=false;function show(){done=false;let q=qs[i];document.getElementById('clue').textContent=q[0];document.getElementById('feedback').textContent='';document.getElementById('answers').innerHTML='';q[2].sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(done)return;done=true;if(x===q[1]){score+=10;document.getElementById('feedback').textContent='🎉 Excellent! Correct answer.'}else document.getElementById('feedback').textContent='Good try! The answer is '+q[1]+'.';document.getElementById('score').textContent=score};document.getElementById('answers').appendChild(b)})}document.getElementById('next').onclick=()=>{i=(i+1)%qs.length;show()};show();</script></body></html>
