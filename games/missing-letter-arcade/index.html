<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missing Letter Arcade</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#07152e,#174b91);color:#fff;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(680px,100%);background:#fff;color:#14234a;border-radius:28px;padding:clamp(20px,5vw,42px);text-align:center;box-shadow:0 20px 60px #0005}a{color:#2356a8;font-weight:800}.tag{color:#5874ad;font-weight:900;letter-spacing:2px;font-size:12px}h1{font-size:clamp(30px,6vw,48px);margin:8px 0}.word{font-size:clamp(44px,10vw,70px);font-weight:900;letter-spacing:8px;color:#1259d5;margin:26px}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}button{border:0;border-radius:14px;padding:14px 22px;font-size:22px;font-weight:900;cursor:pointer;background:#e7efff;color:#1948a3}button:hover{background:#bed4ff}.primary{background:#1759dc;color:white;font-size:16px}.feedback{min-height:36px;font-weight:800;margin:16px}small{color:#6e7891}</style></head><body><main class="card"><p><a href="../../">← Back to Games</a></p><div class="tag">ARCADE MODE • GRADE 1</div><h1>Missing Letter Arcade</h1><p>Choose the missing letter to complete the word.</p><div id="word" class="word">g _ a l</div><div id="choices" class="choices"></div><p id="feedback" class="feedback">Ready to play?</p><p>⭐ Score: <b id="score">0</b> · Question <b id="progress">1</b>/10</p><button id="next" class="primary">Start / Next Word →</button></main><script>const words=[["g","o","al","goal"],["m","a","p","map"],["s","u","n","sun"],["b","u","s","bus"],["h","a","il","hail"],["t","h","under","thunder"],["s","p","ace","space"],["f","l","uffy","fluffy"],["l","i","ghtning","lightning"],["t","o","rnado","tornado"]];let i=0,score=0,answered=false;function show(){answered=false;let w=words[i],missing=w[1];document.getElementById('word').textContent=w[0]+' _ '+w[2];document.getElementById('progress').textContent=i+1;document.getElementById('feedback').textContent='Choose the correct letter.';let opts=[missing,...'abcdefgilmnorstuv'].filter((x,j,a)=>a.indexOf(x)===j).sort(()=>Math.random()-.5).slice(0,4);if(!opts.includes(missing))opts[0]=missing;document.getElementById('choices').innerHTML='';opts.sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(answered)return;answered=true;if(x===missing){score+=10;document.getElementById('feedback').textContent='🎉 Correct! The word is '+w[3]+'.'}else document.getElementById('feedback').textContent='💡 Good try! The word is '+w[3]+'.';document.getElementById('score').textContent=score};document.getElementById('choices').appendChild(b)})}document.getElementById('next').onclick=()=>{i=(i+1)%words.length;show()};show();</script></body></html>
