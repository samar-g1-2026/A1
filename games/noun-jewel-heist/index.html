<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singular and Plural | Grammar Adventure</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:system-ui;background:linear-gradient(135deg,#fff2d7,#ffbb58)}.card{width:min(700px,100%);background:white;border-radius:28px;padding:clamp(20px,5vw,42px);text-align:center;box-shadow:0 20px 50px #6b390e30;color:#473018}a{color:#9a4d00;font-weight:800}.tag{font-weight:900;letter-spacing:2px;color:#b36b15;font-size:12px}h1{font-size:clamp(28px,6vw,45px);margin:8px}.gem{font-size:60px}.question{font-size:clamp(23px,5vw,34px);font-weight:900;margin:22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:2px solid #f4d5a6;background:#fff8e8;border-radius:14px;padding:14px;font-weight:900;font-size:17px;cursor:pointer;color:#633c15}button:hover{background:#ffe6b7}.feedback{min-height:30px;font-weight:800}#next{background:#a65b06;color:white;border:0;margin-top:12px}@media(max-width:480px){.answers{grid-template-columns:1fr}}</style></head><body><main class="card"><p><a href="../../">← Back to Games</a></p><div class="tag">GRAMMAR • GRADE 1</div><div class="gem">💎</div><h1>Singular &amp; Plural Jewel Heist</h1><p>Choose the correct plural form to collect the jewel!</p><div id="q" class="question"></div><div id="answers" class="answers"></div><p id="feedback" class="feedback"></p><p>💎 Jewels collected: <b id="score">0</b></p><button id="next">Next Challenge →</button></main><script>const qs=[['one cat','cats','cates','cat'],['one box','boxs','boxes','boxies'],['one bus','buses','buss','buse'],['one baby','babys','babies','babyes'],['one book','books','bookes','bookies'],['one dish','dishs','dishes','dishies'],['one fox','foxes','foxs','foxies'],['one toy','toys','toies','toyes'],['one class','classes','classs','classies'],['one pencil','pencils','penciles','pencilies']];let i=0,score=0,done=false;function show(){done=false;let q=qs[i];document.getElementById('q').textContent='What is the plural of '+q[0]+'?';document.getElementById('feedback').textContent='';let a=[q[1],q[2],q[3]].sort(()=>Math.random()-.5);document.getElementById('answers').innerHTML='';a.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(done)return;done=true;if(x===q[1]){score++;document.getElementById('feedback').textContent='🎉 Correct! Jewel unlocked!'}else document.getElementById('feedback').textContent='Try again next time. Correct answer: '+q[1];document.getElementById('score').textContent=score};document.getElementById('answers').appendChild(b)})}document.getElementById('next').onclick=()=>{i=(i+1)%qs.length;show()};show();</script></body></html>
